name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated manifests are up to date and skills are valid
        run: npm run check
      - name: Every JSON file parses
        run: |
          find . -name '*.json' -not -path './node_modules/*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))'
      - name: Every document has English, Portuguese and Spanish versions
        run: |
          missing=0
          for f in $(git ls-files '*.md' | grep -vE '\.(pt-BR|es)\.md$' | grep -vE '^(CHANGELOG|AGENTS|CLAUDE|GEMINI)\.md$|SKILL\.md$|^\.github/|^docs/|^src/'); do
            for lang in pt-BR es; do
              case "$f" in
                CODE_OF_CONDUCT.md|CONTRIBUTING.md|SECURITY.md|SUPPORT.md) t="i18n/${f%.md}.$lang.md" ;;
                *) t="${f%.md}.$lang.md" ;;
              esac
              [ -f "$t" ] || { echo "missing $t"; missing=1; }
            done
          done
          exit $missing
