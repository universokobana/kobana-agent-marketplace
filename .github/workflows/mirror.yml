name: Publish

# Publishes main and the release tags to the public repository, with the same history. Runs only in the maintainers'
# repository. Pushes are fast-forward: they fail instead of overwriting.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository_owner == 'universokobana' &&
      github.repository != 'universokobana/kobana-agent-marketplace' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse to publish internal material
        run: |
          git fetch origin main internal || true
          git fetch https://github.com/universokobana/kobana-agent-marketplace.git main:refs/published/main
          fail() { echo "::error::$1"; exit 1; }
          # No commit in the published history may touch internal/, where all internal material lives
          [ -z "$(git rev-list HEAD -- internal/)" ] || fail "A commit in the history touches internal/."
          # No commit of the internal branch (current or older) may be in the history
          if git rev-parse -q --verify origin/internal >/dev/null; then
            for c in $(git rev-list origin/internal --not refs/published/main); do
              ! git merge-base --is-ancestor "$c" HEAD || fail "The history contains $c from the internal branch."
            done
          fi
          # Tags are published only for commits on main
          case "$GITHUB_REF" in refs/tags/*)
            git merge-base --is-ancestor HEAD origin/main || fail "The tag points to a commit that is not on main." ;;
          esac
      - name: Push to the public repository
        env:
          PUBLIC_MIRROR_DEPLOY_KEY: ${{ secrets.PUBLIC_MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PUBLIC_MIRROR_DEPLOY_KEY" > ~/.ssh/public_mirror
          chmod 600 ~/.ssh/public_mirror
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/public_mirror -o IdentitiesOnly=yes"
          # main also carries the release tags already on it (GitHub starts no run when more than three tags are pushed at once)
          refs="$GITHUB_REF:$GITHUB_REF"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            for t in $(git tag --merged HEAD --list 'v*'); do refs="$refs refs/tags/$t:refs/tags/$t"; done
          fi
          git push git@github.com:universokobana/kobana-agent-marketplace.git $refs
